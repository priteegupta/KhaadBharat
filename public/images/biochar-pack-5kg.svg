    <path d="M390 320 C390 286 418 258 452 258 H748 C782 258 810 286 810 320 V365 H390 Z" fill="#1b1614"/>
    <path d="M390 365 H810 V455 C810 492 780 522 743 522 H457 C420 522 390 492 390 455 Z" fill="url(#accent)"/>
    <rect x="430" y="560" width="340" height="420" rx="28" fill="#f5f0e4"/>
    <rect x="448" y="578" width="304" height="74" rx="18" fill="#5c7f2f"/>
    <text x="600" y="627" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="44" font-weight="700" fill="#fff">KHAAD BHARAT</text>
    <text x="600" y="710" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="70" font-weight="800" fill="#1f2f1b">BIOCHAR</text>
    <text x="600" y="772" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="30" fill="#5a6852">Recyclable biodegradable bag</text>
    <text x="600" y="824" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="28" fill="#5a6852">5 KG Net Weight</text>
    <text x="600" y="872" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" fill="#5a6852">Soil support input | Bio-waste based</text>
    <rect x="470" y="920" width="260" height="34" rx="17" fill="#e8dcb7"/>
    <text x="600" y="944" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="21" font-weight="700" fill="#385629">Batch / MRP / Usage info area</text>
    <path d="M525 960 C560 900 640 900 675 960" fill="none" stroke="#5c7f2f" stroke-width="10" stroke-linecap="round"/>
    <path d="M600 920 C600 890 600 870 600 845" fill="none" stroke="#5c7f2f" stroke-width="9" stroke-linecap="round"/>
    <path d="M600 882 C575 850 545 842 520 850 C545 875 568 886 600 882 Z" fill="#5c7f2f"/>
    <path d="M600 882 C625 850 655 842 680 850 C655 875 632 886 600 882 Z" fill="#cd8a1d"/>
