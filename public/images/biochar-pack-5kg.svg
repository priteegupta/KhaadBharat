<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">KHAAD BHARAT Biochar 5kg pack</title>
  <desc id="desc">Recyclable biodegradable bag mockup for 5kg KHAAD BHARAT biochar with logo and label details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6edd8"/>
      <stop offset="100%" stop-color="#d9c08f"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f2a27"/>
      <stop offset="100%" stop-color="#171311"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c7f2f"/>
      <stop offset="100%" stop-color="#cd8a1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#6b4821" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <ellipse cx="600" cy="1420" rx="280" ry="55" fill="#5b4327" opacity="0.22"/>
  <g filter="url(#shadow)">
