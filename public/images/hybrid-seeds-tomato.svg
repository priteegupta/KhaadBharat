<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Tomato hybrid seed catalog card</title>
  <desc id="desc">Hybrid tomato seed packet card for the vegetable seed catalog.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1e8"/>
      <stop offset="100%" stop-color="#ffd7c3"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cf2f2f"/>
      <stop offset="100%" stop-color="#871d1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <ellipse cx="600" cy="1370" rx="250" ry="45" fill="#92513c" opacity="0.18"/>
